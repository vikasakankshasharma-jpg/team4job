name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Set up Java (for Firebase Emulator)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Run Jest Integration & Adversarial Tests
      run: |
        npm install -g firebase-tools
        firebase emulators:exec --project demo-stitch-test "npm test"
        
    - name: Next.js Build (Dry Run for Vercel)
      run: npm run build
      env:
        NEXT_PUBLIC_USE_EMULATOR: 'false'
        # Pass mock build-time variables if needed

  # Add deployment job here if bypassing Vercel's automated git deployment
